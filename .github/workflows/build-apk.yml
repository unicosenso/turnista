name: Compila APK

on:
  push:
    branches: [main, turnirsp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Crea i file Android mancanti (Gradle, icone, stili).
      # I file già presenti nel repo (manifest, codice Kotlin, lib/) NON vengono sovrascritti.
      - name: Prepara progetto Android
        run: flutter create --platforms=android --org eu.mastriani --project-name turnista .

      - name: Dipendenze
        run: flutter pub get

      - name: Controllo codice
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test logica turni
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test_out.txt
        continue-on-error: true

      - name: Compila
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build_out.txt

      # Riassunto leggibile dall'API di GitHub (i log completi non sono sempre accessibili).
      - name: Riassunto
        if: always()
        run: |
          if [ -f test_out.txt ]; then
            echo "::notice title=Test::$(tail -c 3000 test_out.txt | grep -E 'tests passed|Some tests failed|letto|Expected|Actual|Error' | tail -40 | tr '\n' '|' )"
          fi
          if [ -f build_out.txt ] && grep -qiE 'error|failed' build_out.txt; then
            echo "::error title=Compilazione::$(grep -iE 'error|failed|what went wrong|e: ' -A2 build_out.txt | head -60 | tr '\n' '|' )"
          fi

      # Firma sempre con la stessa chiave, così gli aggiornamenti si installano sopra la versione vecchia.
      - name: Firma
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PW=$(cat keystore/password.txt)
          "$BT/apksigner" sign \
            --ks keystore/turnista.jks \
            --ks-key-alias turnista \
            --ks-pass "pass:$PW" \
            --key-pass "pass:$PW" \
            --out Turnista.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify Turnista.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Turnista-apk
          path: Turnista.apk

      - name: Pubblica come "ultima versione"
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Turnista ${{ github.run_number }}
          make_latest: true
          files: Turnista.apk

      # Le versioni di prova di TurniRSP escono a parte, senza toccare l'"ultima versione" di Turnista.
      - name: Pubblica versione di prova TurniRSP
        if: github.ref_name == 'turnirsp'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: turnirsp-${{ github.run_number }}
          name: TurniRSP prova ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: Turnista.apk
