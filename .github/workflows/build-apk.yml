name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Crea i file Android mancanti (Gradle, icone, stili).
      # I file già presenti nel repo (manifest, codice Kotlin, lib/) NON vengono sovrascritti.
      - name: Prepara progetto Android
        run: flutter create --platforms=android --org eu.mastriani --project-name turnista .

      - name: Dipendenze
        run: flutter pub get

      - name: Controllo codice
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test logica turni
        run: flutter test
        continue-on-error: true

      - name: Compila
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # Firma sempre con la stessa chiave, così gli aggiornamenti si installano sopra la versione vecchia.
      - name: Firma
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PW=$(cat keystore/password.txt)
          "$BT/apksigner" sign \
            --ks keystore/turnista.jks \
            --ks-key-alias turnista \
            --ks-pass "pass:$PW" \
            --key-pass "pass:$PW" \
            --out Turnista.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify Turnista.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Turnista-apk
          path: Turnista.apk

      - name: Pubblica come "ultima versione"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Turnista ${{ github.run_number }}
          make_latest: true
          files: Turnista.apk
