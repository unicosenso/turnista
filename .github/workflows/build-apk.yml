name: Compila APK

on:
  push:
    branches: [main, turnirsp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Crea i file Android mancanti (Gradle, icone, stili).
      # I file già presenti nel repo (manifest, codice Kotlin, lib/) NON vengono sovrascritti.
      - name: Prepara progetto Android
        run: flutter create --platforms=android --org eu.mastriani --project-name turnista .

      # Sul ramo turnirsp l'app è un'altra: nome e identificativo propri, si installa accanto a Turnista.
      - name: Identità TurniRSP
        if: github.ref_name == 'turnirsp'
        run: |
          G=$(ls android/app/build.gradle* | head -1)
          sed -i 's/applicationId *=\? *"eu.mastriani.turnista"/applicationId = "eu.mastriani.turnirsp"/' "$G"
          grep -n applicationId "$G"

      - name: Dipendenze
        run: flutter pub get

      - name: Controllo codice
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test logica turni
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test_out.txt
        continue-on-error: true

      - name: Compila
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build_out.txt

      # Copia gli ultimi messaggi di test e compilazione nel ramo "ci-log", leggibile da remoto.
      - name: Riassunto
        if: always() && github.ref_name != 'main'
        run: |
          mkdir -p /tmp/log && cd /tmp/log
          [ -f "$GITHUB_WORKSPACE/test_out.txt" ] && tail -c 20000 "$GITHUB_WORKSPACE/test_out.txt" > test.txt
          [ -f "$GITHUB_WORKSPACE/build_out.txt" ] && tail -c 20000 "$GITHUB_WORKSPACE/build_out.txt" > build.txt
          git init -q && git checkout -q -b ci-log
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "log run ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log

      # Firma sempre con la stessa chiave, così gli aggiornamenti si installano sopra la versione vecchia.
      - name: Firma
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PW=$(cat keystore/password.txt)
          "$BT/apksigner" sign \
            --ks keystore/turnista.jks \
            --ks-key-alias turnista \
            --ks-pass "pass:$PW" \
            --key-pass "pass:$PW" \
            --out Turnista.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify Turnista.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Turnista-apk
          path: Turnista.apk

      - name: Pubblica come "ultima versione"
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Turnista ${{ github.run_number }}
          make_latest: true
          files: Turnista.apk

      # Le versioni di prova di TurniRSP escono a parte, senza toccare l'"ultima versione" di Turnista.
      - name: Nome APK TurniRSP
        if: github.ref_name == 'turnirsp'
        run: cp Turnista.apk TurniRSP.apk

      - name: Pubblica versione di prova TurniRSP
        if: github.ref_name == 'turnirsp'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: turnirsp-${{ github.run_number }}
          name: TurniRSP prova ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: TurniRSP.apk
